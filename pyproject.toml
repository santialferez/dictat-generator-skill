[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dictat-generator-skill"
version = "0.1.0"
description = "Agent skill and CLI for generating classroom dictation audio packages with Google Gemini TTS."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "google-genai>=2.0.0",
]

[project.scripts]
dictat-gen = "dictat_generator_skill.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

